<script>
(function(){
  var SUPABASE_URL = 'https://qvzlwhwxspmofrwdvgdd.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2emx3aHd4c3Btb2Zyd2R2Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzcyNDQsImV4cCI6MjA5OTc1MzI0NH0.uMdamJNn-GHRGfcTNnij6gapaG49bnXjC2fk32RcTfg';
  var createClient = supabase.createClient;
  var sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: window.sessionStorage } });
  var AUTH_EMAIL_DOMAIN = '@skylife-agent.local';
  var USERNAME_RE = /^[a-zA-Z0-9_-]{4,20}$/;

  function unlock(){
    document.getElementById('lock-overlay').classList.add('hidden');
    startLineDraw();
  }
  function showLoginForm(){
    document.getElementById('lock-loading').style.display = 'none';
    document.getElementById('login-area').classList.add('show');
  }
  function setMsg(type, text){
    var el = document.getElementById('login-msg');
    el.className = 'auth-msg' + (type ? ' ' + type : '');
    el.textContent = text;
  }

  async function checkApprovedAndUnlock(userId, client, isRealSession){
    var res = await client.from('profiles').select('status').eq('id', userId).single();
    var profile = res.data, error = res.error;
    if(error || !profile || profile.status !== 'approved'){
      if(isRealSession) await sb.auth.signOut();
      showLoginForm();
      setMsg('error', profile && profile.status === 'pending' ? '관리자 승인 대기 중입니다' : profile && profile.status === 'rejected' ? '이용이 제한된 계정입니다' : '접근 권한이 없습니다');
      return false;
    }
    unlock();
    return true;
  }

  window.handleLogin = async function(e){
    e.preventDefault();
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value;
    if(!USERNAME_RE.test(username)){ setMsg('error','아이디 형식이 올바르지 않습니다'); return false; }
    var btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '로그인 중...';
    var res = await sb.auth.signInWithPassword({ email: username.toLowerCase() + AUTH_EMAIL_DOMAIN, password: password });
    btn.disabled = false; btn.textContent = '로그인';
    if(res.error){ setMsg('error','아이디 또는 비밀번호가 올바르지 않습니다'); return false; }
    await checkApprovedAndUnlock(res.data.session.user.id, sb, true);
    return false;
  };

  async function init(){
    var hash = location.hash;
    if(hash && hash.indexOf('sso=') !== -1){
      var token = decodeURIComponent(hash.split('sso=')[1].split('&')[0]);
      history.replaceState(null, '', location.pathname + location.search);
      var tokenClient = createClient(SUPABASE_URL, SUPABASE_KEY, { global: { headers: { Authorization: 'Bearer ' + token } } });
      var userRes = await tokenClient.auth.getUser(token);
      if(!userRes.error && userRes.data.user){
        await checkApprovedAndUnlock(userRes.data.user.id, tokenClient, false);
        return;
      }
    }
    // SSO 토큰이 없거나 만료된 경우, 기존 로그인 세션이 남아있는지 서버에 매번 재확인한다.
    // (탭 내 캐시 플래그로 이 확인을 건너뛰면 관리자가 계정을 승인 취소해도 즉시 반영되지 않는 문제가 있었음)
    var sessionRes = await sb.auth.getSession();
    if(sessionRes.data.session){
      await checkApprovedAndUnlock(sessionRes.data.session.user.id, sb, true);
    } else {
      showLoginForm();
    }
  }
  window.addEventListener('DOMContentLoaded', init);
})();
</script>

<script>
  // ============================================================
  // FAQ 데이터
  // ============================================================
  let FAQ_DATA = [];

  // ============================================================
  // 부정가입방지 조치내역 데이터
  // ============================================================
  let FRAUD_DATA = [];
  // ============================================================

  const FRAUD_CAT = "부정가입방지";
  let currentCat = "전체";

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function highlight(text, keyword) {
    if (!keyword) return escapeHtml(text);
    const re = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let result = '', lastIdx = 0, m;
    while ((m = re.exec(text)) !== null) {
      result += escapeHtml(text.slice(lastIdx, m.index)) + '<mark>' + escapeHtml(m[0]) + '</mark>';
      lastIdx = re.lastIndex;
    }
    return result + escapeHtml(text.slice(lastIdx));
  }

  function buildTabs() {
    const cats = ["전체", ...new Set(FAQ_DATA.map(d => d.category))];
    const tabsEl = document.getElementById("tabs");
    const faqTabsHtml = cats.map(c =>
      `<button type="button" class="tab${c === "전체" ? " active" : ""}" data-cat="${c}">${c}</button>`
    ).join("");
    const fraudTabHtml = `<button type="button" class="tab fraud-tab" data-cat="${FRAUD_CAT}">부정가입방지</button>`;
    tabsEl.innerHTML = faqTabsHtml + fraudTabHtml;

    tabsEl.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        currentCat = btn.dataset.cat;
        tabsEl.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });
  }

  function buildFraudList() {
    const list = document.getElementById("fraudList");
    list.innerHTML = FRAUD_DATA.map(d => `
      <div class="fraud-item">
        <div class="fraud-date">${escapeHtml(d.date)}</div>
        <div class="fraud-org">${escapeHtml(d.org)}</div>
        <div class="fraud-body">
          <div class="fraud-content">${escapeHtml(d.content)}</div>
          ${d.note ? `<div class="fraud-note">※ ${escapeHtml(d.note)}</div>` : ''}
        </div>
      </div>
    `).join("");
  }

  function render() {
    const isFraud = currentCat === FRAUD_CAT;
    const faqList = document.getElementById("faqList");
    const noResult = document.getElementById("noResult");
    const searchWrap = document.getElementById("searchWrap");
    const fraudSection = document.getElementById("fraudSection");

    if (isFraud) {
      faqList.innerHTML = "";
      noResult.style.display = "none";
      searchWrap.style.display = "none";
      fraudSection.classList.add("active");
      return;
    }

    searchWrap.style.display = "";
    fraudSection.classList.remove("active");

    const keyword = document.getElementById("searchInput").value.trim().toLowerCase().replace(/\s+/g, '');

    let items = FAQ_DATA;
    const norm = s => s.toLowerCase().replace(/\s+/g, '');
    if (currentCat !== "전체") items = items.filter(d => d.category === currentCat);
    if (keyword) items = items.filter(d =>
      norm(d.q).includes(keyword) || norm(d.a).includes(keyword)
    );

    if (items.length === 0) {
      faqList.innerHTML = "";
      noResult.style.display = "block";
      return;
    }

    noResult.style.display = "none";
    faqList.innerHTML = items.map((d, i) => `
      <div class="faq-item" data-idx="${i}">
        <button type="button" class="faq-question">
          <span class="q-badge">Q</span>
          <span class="q-text">${highlight(d.q, keyword)}</span>
          <span class="arrow"><svg><use href="#i-chevron"></use></svg></span>
        </button>
        <div class="faq-answer">${highlight(d.a, keyword)}</div>
      </div>
    `).join("");

    faqList.querySelectorAll(".faq-item").forEach(item => {
      item.querySelector(".faq-question").addEventListener("click", () => {
        const wasOpen = item.classList.contains("open");
        item.classList.toggle("open");
        if (!wasOpen) recordFaqClick(item.querySelector(".q-text").textContent.trim());
      });
    });
  }

  document.getElementById("searchInput").addEventListener("input", () => {
    render();
    recordSearch(document.getElementById("searchInput").value.trim());
  });

  // ── 인기 검색어 추적 ────────────────────────────────────────────────────
  const SYNONYMS_DEF = {
    '개통':        ['신규가입', '개통방법', '개통시간', '가입방법', '개통가능'],
    '번호이동':    ['번이', '번호이동방법', '번호이동절차', '번호이동시'],
    '해지':        ['취소', '해약', '개통취소', '해지방법'],
    '유심':        ['usim', 'sim', '심카드', '유심교체', '유심변경', '유심불량', '유심재사용'],
    'esim':        ['이심', '듀얼유심', '듀얼심', '이심개통'],
    '요금제':      ['요금', '플랜', '요금변경', '요금제변경', '데이터요금제'],
    '데이터쉐어링':['쉐어링', '데이터공유', '데이터셰어링'],
    '테더링':      ['핫스팟'],
    '로밍':        ['해외로밍', '국제로밍', '해외사용', '해외'],
    '외국인':      ['외국인가입', '외국인개통', '외국인등록증', '외국'],
    '미납':        ['연체', '미납금', '체납', '미납금액'],
    '서류':        ['신분증', '필요서류', '가족관계증명서'],
    '실명인증':    ['실명인증실패', '인증실패', '실명오류', '인증오류'],
    '미성년자':    ['청소년', '미성년', '자녀가입'],
    '고객센터':    ['연락처', '전화번호', '콜센터', '문의전화'],
    '결합':        ['결합할인', '가족결합', '모바일결합'],
    '부정가입방지':['부정가입', '부정', '가입제한', '가입차단'],
    '통화품질':    ['통화불량', '품질미약', '수신불량', '통화약'],
    '나밍오류':    ['유심인식', '단말기인식', '인식안됨', '나밍'],
  };

  const SYNONYM_MAP = {};
  Object.entries(SYNONYMS_DEF).forEach(([canonical, list]) => {
    SYNONYM_MAP[canonical] = canonical;
    list.forEach(s => { SYNONYM_MAP[s.replace(/\s+/g, '').toLowerCase()] = canonical; });
  });

  function normalizeKeyword(kw) {
    const clean = kw.toLowerCase().replace(/\s+/g, '');
    return SYNONYM_MAP[clean] || clean;
  }

  const STATS_API = 'https://skylife-mobile-faq-um3h.vercel.app/api/stats';
  let _lastRanking = [];

  async function fetchRanking() {
    try {
      const res = await fetch(STATS_API);
      const data = await res.json();
      _lastRanking = Array.isArray(data.ranking) ? data.ranking : [];
    } catch {
      // 네트워크 오류 시 마지막으로 받아온 랭킹 유지
    }
    renderRankingPanel();
  }

  async function bumpKeyword(kw) {
    try {
      const res = await fetch(STATS_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kw }),
      });
      const data = await res.json();
      _lastRanking = Array.isArray(data.ranking) ? data.ranking : _lastRanking;
    } catch {
      // 실패해도 UI는 유지, 다음 로드 시 재동기화
    }
    renderRankingPanel();
  }

  let _rankTimer = null;
  function recordSearch(kw) {
    if (!kw || kw.length < 2) return;
    clearTimeout(_rankTimer);
    _rankTimer = setTimeout(() => {
      bumpKeyword(normalizeKeyword(kw));
    }, 800);
  }

  function recordFaqClick(title) {
    // 제목 첫 단어로 정규화 시도, 매핑 없으면 그대로 사용
    const firstWord = title.split(/[\s\-\/\(]+/)[0].toLowerCase();
    const key = SYNONYM_MAP[firstWord] || normalizeKeyword(firstWord) || firstWord;
    bumpKeyword(key);
  }

  function renderRankingPanel() {
    const panel = document.getElementById('rankingPanel');
    const sorted = _lastRanking.map(r => [r.kw, r.count]).slice(0, 10);
    /* 메달 이모지 대신 순위 숫자를 그대로 쓰고, 상위 3개는 CSS로 강조한다 */
    const RANK_CLS = ['top1', 'top2', 'top3'];

    let inner = `<div class="rp-header"><h3>인기 검색어 TOP 10</h3><button class="rp-reset" onclick="resetStats()">초기화</button></div>`;
    if (sorted.length === 0) {
      inner += `<div class="rp-empty">아직 기록이 없습니다.<br>검색하거나 FAQ를<br>열면 누적됩니다.</div>`;
    } else {
      const max = sorted[0][1];
      inner += `<div class="rank-list">${sorted.map(([kw, cnt], i) => {
        const cls = i < 3 ? RANK_CLS[i] : 'other';
        const num = i + 1;
        const pct = Math.round(cnt / max * 100);
        return `<div class="rank-item">
          <div class="rank-top">
            <div class="rank-num ${i < 3 ? RANK_CLS[i] : ''}">${num}</div>
            <div class="rank-kw" data-kw="${escapeHtml(kw)}" onclick="searchByRank(this.dataset.kw)">${escapeHtml(kw)}</div>
            <div class="rank-cnt">${cnt}회</div>
          </div>
          <div class="rank-bar-wrap"><div class="rank-bar ${cls}" style="width:0%" data-pct="${pct}"></div></div>
        </div>`;
      }).join('')}</div>`;
    }
    panel.innerHTML = inner;
    requestAnimationFrame(() => {
      panel.querySelectorAll('.rank-bar').forEach(bar => { bar.style.width = bar.dataset.pct + '%'; });
    });
  }

  async function resetStats() {
    const key = prompt('관리자 암호를 입력하세요.');
    if (key === null) return;
    try {
      const res = await fetch(STATS_API, {
        method: 'DELETE',
        headers: { 'X-Admin-Key': key },
      });
      if (res.status === 403) { alert('암호가 올바르지 않습니다.'); return; }
      const data = await res.json();
      _lastRanking = Array.isArray(data.ranking) ? data.ranking : [];
      renderRankingPanel();
    } catch {
      alert('초기화 중 오류가 발생했습니다.');
    }
  }
  function searchByRank(kw) {
    const input = document.getElementById('searchInput');
    input.value = kw;
    render();
  }
  // ────────────────────────────────────────────────────────────────────────

  async function loadData() {
    try {
      const res = await fetch('data/faq.json?t=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      FAQ_DATA = Array.isArray(data.FAQ_DATA) ? data.FAQ_DATA : [];
      FRAUD_DATA = Array.isArray(data.FRAUD_DATA) ? data.FRAUD_DATA : [];
      buildTabs();
      buildFraudList();
      render();
      fetchRanking();
    } catch (err) {
      document.getElementById('faqList').innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
          <div style="display:flex;justify-content:center;margin-bottom:12px;"><svg style="width:36px;height:36px;color:var(--light)"><use href="#i-warn"></use></svg></div>
          <div style="font-size:14px;font-weight:700;margin-bottom:8px;">데이터를 불러오지 못했습니다</div>
          <div style="font-size:12px;color:#999;margin-bottom:16px;">${err.message.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</div>
          <button onclick="loadData()" style="background:#E60012;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">다시 시도</button>
        </div>`;
      document.getElementById('noResult').style.display = 'none';
    }
  }
  loadData();
</script>
</body>
</html>
